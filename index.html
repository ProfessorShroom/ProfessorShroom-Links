<!doctype html>

<!--
  To change the theme, change the class on the html tag below to one of:
  - theme-auto: Automatically switches based on user's system preferences
  - theme-light: Forces light theme
  - theme-dark: Forces dark theme
-->

<html class="theme-dark" lang="en">
  <!-- Update `class="theme-auto"` with your preference -->

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Page Title - Change this to your name/brand (50-60 characters recommended) -->
    <title>ProfessorShroom</title>
    <link rel="icon" type="image/png" href="images/avatar.png" />
    <!-- Update this with your own favicon -->

    <!-- Meta Description - Write a description (150-160 characters recommended) -->
    <meta
      name="description"
      content="Hey, I’m ProfessorShroom! I’m a computer technician, gamer, car enthusiast, collector, occasional designer and coder."
    />

    <!-- Canonical URL - Helps prevent duplicate content issues -->
    <link rel="canonical" href="https://professorshroom.com" />

    <!-- Author Information -->
    <meta name="author" content="ProfessorShroom" />

    <!-- Browser UI Color - Matches the default light/dark theme backgrounds -->
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121212"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Social Sharing (Open Graph & Twitter) - Uncomment and fill in to control how your page
         looks when shared on social platforms and in chat apps.
         og:url and og:image must be full absolute URLs. -->
    <!--
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Name">
    <meta property="og:description" content="A short description of your page.">
    <meta property="og:url" content="https://yourwebsite.com">
    <meta property="og:image" content="https://yourwebsite.com/images/avatar@2x.png">
    <meta name="twitter:card" content="summary">
    -->

    <!-- Font Preloads - Lets the browser fetch fonts in parallel with the stylesheets -->
    <link
      rel="preload"
      href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="fonts/open-sans-v34-vietnamese_latin-ext_latin_hebrew_greek-ext_greek_cyrillic-ext_cyrillic-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/brands.css" />

    <!-- LittleLink Extended Stylesheet (Optional) -->
    <!-- <link rel="stylesheet" href="css/brands-extended.css"> -->
    <!-- Learn more at https://github.com/sethcottle/littlelink-extended.
         Remove comments if you've added LittleLink Extended dependencies -->
  </head>

  <body>
    <div class="container">
      <div class="column">
        <main>
          <!--
              By default, the Avatar is rounded. Use the following:
              - avatar--rounded: Automatically rounds the image
              - avatar--soft: Slightly rounds the image
              - avatar--none: Removes any rounding

              Be sure to replace the src with your own image path and update the alt text
            -->
          <img
            class="avatar avatar--rounded"
            src="images/avatar.png"
            srcset="images/avatar@2x.png 2x"
            alt="LittleLink"
            width="128"
            height="128"
            fetchpriority="high"
          />

          <!-- Replace with your name or brand -->
          <h1>ProfessorShroom</h1>

          <!-- Add a short description about yourself or your brand -->
          <p>
            Hey, I’m ProfessorShroom! 🍄 I’m a computer technician, gamer, car
            enthusiast, collector, occasional designer and coder.
          </p>

        <a class="button button-default" href="https://professorshroom.com" target="_blank" rel="noopener">
          <img class="icon" src="images/avatar.png" alt="Website Icon">My Site
        </a>
        <br>

        <h2>Tip Me</h2>

        <a class="button button-beer" href="https://coff.ee/professorshroom" target="_blank" rel="noopener">
          <img class="icon" src="images/icons/buy-me-a-beer.svg" alt="Buy Me a Beer">Buy Me a Beer
        </a>
        <br>

        <h2>Social Links</h2>

        <a class="button button-github" href="https://github.com/professorshroom" target="_blank" rel="noopener">
          <img class="icon" src="images/icons/github.svg" alt="GitHub Logo">GitHub
        </a>
        <br>

        <a class="button button-instagram" href="https://instagram.com/professorshroombinders" target="_blank" rel="noopener"><img class="icon" aria-hidden="true" src="images/icons/instagram.svg" alt="Instagram Logo">Instagram</a>
        <br>

        <h2>My Projects</h2>

        <a class="button button-project-crc" href="https://professorshroom.com/projects/PlutoPoint_Installer/" target="_blank" rel="me noopener">
          <img class="icon" src="images/icons/crc-installer.svg">PlutoPoint Installer
        </a>
        <br>

        <a class="button button-project" href="https://professorshroombinders.com" target="_blank" rel="me noopener">
          <img class="icon" src="images/icons/professorshroombinders.svg">ProfessorShroom Binders
        </a>
        <br>

        <a class="button button-project-wuphf" href="https://wuphf.co.uk" target="_blank" rel="me noopener">
          <img class="icon" src="images/icons/wuphf.svg">WUPHF
        </a>
        <br>

        <a class="button button-project" href="https://professorshroom.com/projects/Cardmarket_Price_Updater/" target="_blank" rel="me noopener">
          <img class="icon" src="images/icons/cardmarket.svg">Cardmarket Price Updater
        </a>
        <br>

      </div>
    </div>
  </div>

</body>

</html>
